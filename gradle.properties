org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled while Loom 1.17.13 is still settling.
# See https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip

# Mod Properties
mod_id=limitedspectator
mod_name=Limited Spectator
mod_license=MIT
mod_version=3.0.0-alpha.2
mod_authors=Karashi
mod_description=A restricted spectator mode for Minecraft servers
mod_group_id=com.karashi

# Minecraft — Mojang YY.release.patch versioning. Loaders are split:
#   Fabric  -> 26.2  (stable)
#   NeoForge-> 26.1.2 (26.2 is beta-only; advance when it goes stable)
fabric_minecraft_version=26.2
neoforge_minecraft_version=26.1.2
neoforge_minecraft_version_range=[26.1.2,26.2)

# NeoForge — ModDevGradle 2.0.141+. Full string: <mc-version>.<build-number>
neo_version=26.1.2.78

# Fabric — Loom 1.17 for MC 26.2 (unobfuscated; no remap).
fabric_loader_version=0.19.3
fabric_api_version=0.154.2+26.2
loom_version=1.17.13
